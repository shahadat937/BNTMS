<section class="content">
    <div class="container-fluid">
      <div class="block-header">
        <div class="row">
          <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
            <ul class="breadcrumb breadcrumb-style ">
              <li class="breadcrumb-item">
                <h4 class="page-title">Error Log</h4>
              </li>
              <li class="breadcrumb-item bcrumb-1">
                <a [routerLink]="sharedService.redirectDashboard()"><i class="fas fa-home"></i></a>
              </li>
              <li class="breadcrumb-item bcrumb-2">
                <a href="#" onClick="return false;">Error Log</a>
              </li>
              <li class="breadcrumb-item active">All</li>
            </ul>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
          <div class="card">
            <div class="body">
              <div class="responsive_table">
                <div class="materialTableHeader">
                  <div class="row">
               <h3>Error Log</h3>
                  </div>
                </div>
                <mat-table #table [dataSource]="dataSource" matSort class="mat-cell">
                  
 
              
                    <ng-container matColumnDef="ser">
                      <mat-header-cell *matHeaderCellDef mat-sort-header> Ser: </mat-header-cell>
                      <mat-cell *matCellDef="let element; let i = index;"> {{ ((paging.pageIndex-1) *  paging.pageSize) + i+1}} </mat-cell>
                    </ng-container>    
                      
                    <ng-container matColumnDef="subject">
                      <mat-header-cell *matHeaderCellDef mat-sort-header> Purpose </mat-header-cell>
                      <mat-cell *matCellDef="let element"> {{element.subject}} </mat-cell>
                    </ng-container>
  
                    <ng-container matColumnDef="failureCount">
                      <mat-header-cell *matHeaderCellDef mat-sort-header> Total Failure </mat-header-cell>
                      <mat-cell *matCellDef="let element"> {{element.failureCount}} </mat-cell>
                    </ng-container>
  
                    <ng-container matColumnDef="fileUrl">
                        <mat-header-cell *matHeaderCellDef mat-sort-header> File </mat-header-cell>
                        <mat-cell *matCellDef="let element">
                          <a *ngIf="element.fileUrl" [href]="element.fileUrl" target="_blank" download>
                            <mat-icon>insert_drive_file</mat-icon>
                          </a>
                        </mat-cell>
                      </ng-container>
                      
                    <ng-container matColumnDef="createdDate">
                      <mat-header-cell *matHeaderCellDef mat-sort-header> Upload Date </mat-header-cell>
                      <mat-cell *matCellDef="let element"> {{element.createdDate | date: 'dd MMM, YYYY'}} </mat-cell>
                    </ng-container>
  
                   
                    
                    <ng-container matColumnDef="actions">
                      <mat-header-cell *matHeaderCellDef class="pr-0">Actions</mat-header-cell>
                      <mat-cell *matCellDef="let row; let i=index;" class="pr-0">
                    
                        <button mat-icon-button color="accent" class="btn-tbl-delete" (click)="$event.stopPropagation()"
                          (click)="deleteItem(row)">
                          <mat-icon aria-label="Delete" class="col-white">delete</mat-icon> 
                        </button>
                      </mat-cell>
                    </ng-container>
                  
                    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
                  </mat-table>
                  
                  <mat-paginator [length]="paging.length" [showFirstLastButtons]="masterData.paging.showFirstLastButtons"
                  [pageSize]="paging.pageSize" [pageSizeOptions]="masterData.paging.pageSizeOptions"
                  (page)="pageChanged($event)">
                  </mat-paginator>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
